name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # wrapper 的 distributionUrl 指向国内镜像（本机开发加速用），海外 runner 下载极慢；
      # CI 上改写为官方地址，仓库里的镜像配置保持不变。
      - name: Use official Gradle distribution on CI
        run: sed -i 's#mirrors.aliyun.com/gradle/distributions/v9.5.1#services.gradle.org/distributions#' gradle/wrapper/gradle-wrapper.properties
      # 后端单元测试不依赖 MySQL/Redis，直接在 CI 运行。
      - name: Backend tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # pnpm/action-setup 默认读仓库根的 package.json，本项目前端在 frontend/ 子目录。
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, tests and build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
