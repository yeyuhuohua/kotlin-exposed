- insert:
    - id: mcp-hr
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: hr
        transport: streamable-http
        url: http://host.docker.internal:8081/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.HR_MCP_TOKEN}`'
        toolCallTimeoutMs: 120000
        failOnStartupError: false
