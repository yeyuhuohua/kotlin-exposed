# 首次克隆后将本文件复制为 application.yaml，再填写本机连接参数和密钥。
# application.yaml 已被 Git 忽略，禁止把真实凭据写入本示例。
ktor:
  application:
    modules:
      - com.atguigu.hr.ApplicationKt.module
  deployment:
    port: 8080
    host: 0.0.0.0

database:
  host: localhost
  port: 3306
  name: atguigudb
  user: root
  password: ""

redis:
  host: localhost
  port: 6379
  password: ""
  ttlSeconds: 600

auth:
  # 至少 32 字节的随机签名密钥；留空会拒绝启动，不提供默认密钥。
  jwtSecret: ""
  issuer: hr-api
  audience: hr-api-client
  ttlSeconds: 3600
  initializeSchema: true
  # 首次创建管理员时同时填写；已有账号不会被覆盖。
  adminUsername: ""
  adminPassword: ""
